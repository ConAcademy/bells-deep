<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bells-deep — Gaussian mixture explorer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141418; color: #d4d4d4; }
    body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif; }
    header {
      display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
      padding: 8px 16px; border-bottom: 1px solid #2a2a33; background: #1b1b21;
    }
    header strong { font-size: 16px; letter-spacing: .02em; color: #fff; }
    header span { color: #8a8a99; }
    header nav { margin-left: auto; display: flex; gap: 14px; }
    header a { color: #9ecbff; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    kbd { font: 12px ui-monospace, Menlo, monospace; color: #ccc; background: #2a2a33; padding: 1px 5px; border-radius: 3px; }
    main { flex: 1; min-height: 0; position: relative; }
    #terminal { height: 100%; padding: 4px; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 2rem; font: 16px/1.5 system-ui, sans-serif; white-space: pre-wrap; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <strong>bells-deep</strong>
    <span>3D Gaussian mixture explorer, running in your browser as WebAssembly.</span>
    <span>Press <kbd>?</kbd> for help, <kbd>/</kbd> for commands, <kbd>F3</kbd> for the gallery.</span>
    <nav>
      <a href="https://github.com/ConAcademy/bells-deep">Source on GitHub</a>
      <a href="https://github.com/NimbleMarkets/go-booba">go-booba</a>
    </nav>
  </header>
  <main>
    <div id="terminal"></div>
    <div id="status" role="status">Loading bells-deep…</div>
  </main>
  <script src="_assets/wasm_exec.js"></script>
  <script type="module" src="runtime.js"></script>
</body>
</html>
